version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: raftracare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_production_pw}
      POSTGRES_DB: ${POSTGRES_DB:-raftracare}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - raftra-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: raftracare-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8000
      ENVIRONMENT: production
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_production_pw}@postgres:5432/${POSTGRES_DB:-raftracare}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-raftracare_production_master_jwt_secret_key_32bytes}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_test_placeholder_secret}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-rzp_test_webhook_secret}
    ports:
      - "8000:8000"
    networks:
      - raftra-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: raftracare-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_placeholder}
    ports:
      - "3000:3000"
    networks:
      - raftra-network

volumes:
  postgres_data:
    driver: local

networks:
  raftra-network:
    driver: bridge
